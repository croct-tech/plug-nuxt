name: Validate branch

on:
  push:
    tags-ignore:
      - '**'
    branches:
      - master
  pull_request:
    types:
      - synchronize
      - opened

jobs:
  validate:
    uses: croct-tech/shared-public-configs/.github/workflows/javascript-validations.yml@master
    with:
      node-version: '22'
      use-private-registry: false

  e2e:
    name: e2e (nuxt ${{ matrix.nuxt }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The module supports both majors, so the suite runs against both.
        # The lockfile pins Nuxt 4; the Nuxt 3 leg downgrades on top of it.
        nuxt:
          - '3'
          - '4'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # @nuxt/kit is a direct dependency ranged across both majors, so it has
      # to be pinned alongside nuxt; otherwise the module keeps loading the
      # newest kit while the app runs the other major.
      - name: Install Nuxt ${{ matrix.nuxt }}
        run: npm install --no-save nuxt@^${{ matrix.nuxt }} @nuxt/kit@^${{ matrix.nuxt }}

      - run: npm run build

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run e2e tests
        run: npx playwright test

      - name: Run prerendering e2e tests
        run: npx playwright test -c playwright.prerender.config.ts
